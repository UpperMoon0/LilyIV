name: Deploy Security-Hardened Compose

on:
  push:
    branches: [main]
    paths:
      - docker-compose.prod.yml
      - .github/workflows/deploy-security-compose.yml
  workflow_dispatch:

permissions:
  contents: read

# Share the production Compose lock with sync-compose.yml. Both workflows mutate
# the same containers and must never run docker compose concurrently.
concurrency:
  group: lily-compose-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply internal service trust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch VPS deployment secrets
        id: kv
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            VPS_HOST=$(az keyvault secret show --vault-name nstutcommonkv --name vps-host --query value -o tsv)
            VPS_USER=$(az keyvault secret show --vault-name nstutcommonkv --name vps-username --query value -o tsv)
            VPS_PASS=$(az keyvault secret show --vault-name nstutcommonkv --name vps-password --query value -o tsv)
            DOMAIN_NAME=$(az keyvault secret show --vault-name nstutcommonkv --name domain-name --query value -o tsv)
            for VALUE in "$VPS_HOST" "$VPS_USER" "$VPS_PASS" "$DOMAIN_NAME"; do
              echo "::add-mask::$VALUE"
            done
            echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_OUTPUT"
            echo "VPS_USER=$VPS_USER" >> "$GITHUB_OUTPUT"
            echo "VPS_PASS=$VPS_PASS" >> "$GITHUB_OUTPUT"
            echo "DOMAIN_NAME=$DOMAIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Apply hardened Compose on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          COMPOSE_SHA: ${{ github.sha }}
          DOMAIN_NAME: ${{ steps.kv.outputs.DOMAIN_NAME }}
        with:
          host: ${{ steps.kv.outputs.VPS_HOST }}
          username: ${{ steps.kv.outputs.VPS_USER }}
          password: ${{ steps.kv.outputs.VPS_PASS }}
          port: 22
          timeout: 120s
          command_timeout: 900s
          envs: COMPOSE_SHA,DOMAIN_NAME
          script: |
            set -euo pipefail

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo -n"
              $SUDO true
            fi

            cd /root/LilyIV
            COMPOSE=/root/LilyIV/docker-compose.prod.yml
            BACKUP=${COMPOSE}.security-backup
            TMP=$(mktemp)
            trap 'rm -f "$TMP"' EXIT

            curl -fsSL \
              "https://raw.githubusercontent.com/UpperMoon0/LilyIV/${COMPOSE_SHA}/docker-compose.prod.yml" \
              -o "$TMP"

            grep -q '127.0.0.1:8004:8004' "$TMP"
            grep -q 'user: "10001:10001"' "$TMP"
            grep -q 'read_only: true' "$TMP"
            grep -q 'no-new-privileges:true' "$TMP"
            grep -q 'traefik.docker.network=lily-discord-proxy' "$TMP"
            grep -q 'DISCORD_CHAT_GUILD_IDS=736926591246008350' "$TMP"
            grep -q 'LILY_CORE_HTTP_URL=http://lily-core:8000/api' "$TMP"
            grep -q 'traefik.enable=false' "$TMP"

            ensure_network() {
              name="$1"
              mode="$2"
              if ! $SUDO docker network inspect "$name" >/dev/null 2>&1; then
                if [ "$mode" = internal ]; then
                  $SUDO docker network create --driver bridge --internal "$name" >/dev/null
                else
                  $SUDO docker network create --driver bridge "$name" >/dev/null
                fi
              fi
            }

            connect_if_needed() {
              network="$1"
              container="$2"
              if ! $SUDO docker inspect "$container" >/dev/null 2>&1; then
                echo "Required container $container is missing" >&2
                exit 1
              fi
              if ! $SUDO docker inspect --format '{{json .NetworkSettings.Networks}}' "$container" | grep -q "\"$network\""; then
                $SUDO docker network connect "$network" "$container"
              fi
            }

            ensure_network lily-discord-internal internal
            ensure_network lily-discord-proxy proxy
            connect_if_needed lily-discord-internal redis
            connect_if_needed lily-discord-proxy traefik

            DATA_VOLUME=lily_lily-discord-adapter-data
            $SUDO docker volume create "$DATA_VOLUME" >/dev/null
            DATA_MOUNT=$($SUDO docker volume inspect -f '{{.Mountpoint}}' "$DATA_VOLUME")
            $SUDO chown -R 10001:10001 "$DATA_MOUNT"
            $SUDO chmod 0700 "$DATA_MOUNT"

            $SUDO cp -a "$COMPOSE" "$BACKUP"
            $SUDO install -m 0644 "$TMP" "$COMPOSE"

            rollback() {
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo 'Security compose deployment failed; rolling back.' >&2
                $SUDO mv -f "$BACKUP" "$COMPOSE" || true
                $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate consul || true
                $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate lily-core || true
                $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate lily-discord-adapter || true
              fi
              exit "$rc"
            }
            trap rollback EXIT

            $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate consul
            for i in $(seq 1 30); do
              if $SUDO docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' consul | grep -q '^healthy$'; then
                break
              fi
              sleep 1
            done
            $SUDO docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' consul | grep -q '^healthy$'

            $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate lily-core
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:8000/health >/dev/null

            $SUDO docker compose -f "$COMPOSE" up -d --no-deps --force-recreate lily-discord-adapter

            for i in $(seq 1 60); do
              BODY=$(curl -fsS http://127.0.0.1:8004/health 2>/dev/null || true)
              if printf '%s' "$BODY" | grep -q '"mcp_policy_store_ready":true'; then
                break
              fi
              sleep 2
            done
            BODY=$(curl -fsS http://127.0.0.1:8004/health)
            printf '%s' "$BODY" | grep -q '"mcp_policy_store_ready":true'

            [ "$($SUDO docker exec lily-discord-adapter id -u)" = "10001" ]
            [ "$($SUDO docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' lily-discord-adapter)" = "true" ]
            NETWORKS=$($SUDO docker inspect -f '{{json .NetworkSettings.Networks}}' lily-discord-adapter)
            printf '%s' "$NETWORKS" | grep -q '"lily-discord-internal"'
            printf '%s' "$NETWORKS" | grep -q '"lily-discord-proxy"'
            if printf '%s' "$NETWORKS" | grep -q '"nstut-network"'; then
              echo 'Discord Adapter is still attached to the flat nstut-network' >&2
              exit 1
            fi

            for i in $(seq 1 30); do
              STATUS=$(curl -ksS -o /dev/null -w '%{http_code}' \
                --resolve "lily-discord-adapter.${DOMAIN_NAME}:443:127.0.0.1" \
                "https://lily-discord-adapter.${DOMAIN_NAME}/mcp/" || true)
              if [ "$STATUS" = "401" ] || [ "$STATUS" = "405" ]; then
                break
              fi
              sleep 1
            done
            [ "$STATUS" = "401" ] || [ "$STATUS" = "405" ]

            $SUDO rm -f "$BACKUP"
            trap - EXIT
            rm -f "$TMP"
            echo 'Security-hardened Lily Compose deployed successfully.'
