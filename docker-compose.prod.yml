# Docker Compose for Lily-Core and Lily-Discord-Adapter (Production)
name: lily

services:
  # Lily-Core is an internal service. Localhost remains available for VPS
  # diagnostics, while remote callers must go through an explicitly trusted
  # internal Docker network.
  lily-core:
    image: nstut/lily-core:latest
    container_name: lily-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lily-core-data:/app/data
    networks:
      nstut-network:
        ipv4_address: 172.18.0.10
      lily-discord-internal:
        aliases:
          - lily-core
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - ./Lily-Core/.env
    depends_on:
      consul:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # Lily-Discord-Adapter has two narrowly scoped networks:
  # - lily-discord-internal: Redis/Consul/Lily-Core only
  # - lily-discord-proxy: Traefik ingress and normal Internet egress
  # It is deliberately not attached to the flat nstut-network.
  lily-discord-adapter:
    image: nstut/lily-discord-adapter:latest
    container_name: lily-discord-adapter
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:8004:8004"
    env_file:
      - ./Lily-Discord-Adapter/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - PORT=8004
      - LILY_CORE_HTTP_URL=http://lily-core:8000/api
    volumes:
      - lily-discord-adapter-data:/app/data
    networks:
      lily-discord-internal:
        aliases:
          - lily-discord-adapter
      lily-discord-proxy:
        aliases:
          - lily-discord-adapter
    depends_on:
      lily-core:
        condition: service_started
      consul:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=lily-discord-proxy"
      - "traefik.http.services.lily-discord-adapter.loadbalancer.server.port=8004"
      - "traefik.http.routers.lily-discord-adapter.rule=Host(`lily-discord-adapter.nstut.cloud`)"
      - "traefik.http.routers.lily-discord-adapter.entrypoints=websecure"
      - "traefik.http.routers.lily-discord-adapter.tls.certresolver=myresolver"
      - "traefik.http.routers.lily-discord-adapter.service=lily-discord-adapter"

  # Web-Scout - Web search and summarization service
  web-scout:
    image: nstut/web-scout:latest
    container_name: web-scout
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - ./Web-Scout/.env
    environment:
      - PORT=8000
    volumes:
      - web-scout-data:/app/data
    networks:
      nstut-network:
        ipv4_address: 172.18.0.30
    depends_on:
      consul:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web-scout.loadbalancer.server.port=8000"
      - "traefik.http.routers.web-scout.rule=Host(`web-scout.nstut.cloud`)"
      - "traefik.http.routers.web-scout.entrypoints=websecure"
      - "traefik.http.routers.web-scout.tls.certresolver=myresolver"
      - "traefik.http.routers.web-scout.service=web-scout"

  # Consul is an internal service registry. The dev-mode API is never suitable
  # for unauthenticated Internet exposure.
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    restart: unless-stopped
    ports:
      - "127.0.0.1:8500:8500"
      - "127.0.0.1:8600:8600/udp"
    networks:
      nstut-network:
        ipv4_address: 172.18.0.100
      lily-discord-internal:
        aliases:
          - consul
    command: "agent -dev -client '0.0.0.0' -ui"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=false"

networks:
  nstut-network:
    name: nstut-network
    external: true
  lily-discord-internal:
    name: lily-discord-internal
    external: true
  lily-discord-proxy:
    name: lily-discord-proxy
    external: true

volumes:
  lily-core-data:
    driver: local
  lily-discord-adapter-data:
    driver: local
  web-scout-data:
    driver: local
